[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oss-maintainer-readiness"
version = "0.1.1"
description = "Local-first OSS maintainer readiness checker for public repository evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "ccwenkang-dotcom" }
]
keywords = [
  "open-source",
  "maintainer",
  "repository-health",
  "github",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/ccwenkang-dotcom/oss-maintainer-readiness"
Repository = "https://github.com/ccwenkang-dotcom/oss-maintainer-readiness"
Issues = "https://github.com/ccwenkang-dotcom/oss-maintainer-readiness/issues"
Changelog = "https://github.com/ccwenkang-dotcom/oss-maintainer-readiness/blob/main/CHANGELOG.md"

[project.scripts]
oss-readiness = "oss_maintainer_readiness.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oss_maintainer_readiness"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
