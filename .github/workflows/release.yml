name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Read package version
        id: version
        shell: bash
        run: |
          version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build release distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Validate built wheel and report generation
        shell: bash
        run: |
          python -m venv /tmp/oss-readiness-release-test
          /tmp/oss-readiness-release-test/bin/python -m pip install --upgrade pip
          /tmp/oss-readiness-release-test/bin/python -m pip install dist/*.whl
          /tmp/oss-readiness-release-test/bin/oss-readiness check \
            --repo "$GITHUB_REPOSITORY" \
            --out /tmp/oss-readiness-release-check
          test -s /tmp/oss-readiness-release-check.md
          test -s /tmp/oss-readiness-release-check.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
